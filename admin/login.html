<div class="admin-view admin-login">
    <h1 class="fs-4 mb-3"><i class="bi bi-lock me-2" aria-hidden="true"></i>Station editor</h1>
    <form method="post" action="/admin/login">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required autofocus>
        {{error}}
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>
</div>
