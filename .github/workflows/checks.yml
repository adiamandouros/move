# Lint, type checks, tests and browser tests on every pull request and on main.
# None of them need the network, so nothing here reaches OASA or the relays.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20: what the live server runs; 22: what development uses
        node: [20, 22]
    # Times and dates must follow Athens wherever the clock is set: one run
    # in UTC, the other at UTC+14
    env:
      TZ: ${{ matrix.node == 22 && 'Pacific/Kiritimati' || 'UTC' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The coverage floor of the server code (package.json test:coverage):
      # Node 20 can't check thresholds, so on 22 only
      - if: matrix.node == 22
        run: npm run test:coverage

  # The site in real browsers (test/browser/): phone and desktop Chromium, and
  # WebKit as on an iPhone, each device a job of its own, side by side, so a
  # pull request waits for the slowest one rather than all three (decision
  # 20). Also needs no network: the tests run their own server with test
  # data and a fake OASA.
  browser:
    runs-on: ubuntu-latest
    strategy:
      # One device failing doesn't stop the others: each says what it found
      fail-fast: false
      matrix:
        include:
          - project: phone
            engine: chromium
          - project: desktop
            engine: chromium
          - project: iphone
            engine: webkit
    name: browser (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Keep the report, screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
