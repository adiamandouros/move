# Checks wayhop.gr every 30 minutes (scripts/health-check.js). When it's
# unhealthy, an issue labelled "health" is opened, which GitHub emails to the
# repository's watchers; it's closed when the site is healthy again. One
# issue per outage: later failures don't add to it.
# (GitHub may run scheduled jobs a few minutes late, and pauses them after
# 60 days without activity in the repository.)
name: Health

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check wayhop.gr
        id: check
        continue-on-error: true
        run: node scripts/health-check.js https://wayhop.gr > report.md
      - name: Open or close the health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ "${{ steps.check.outcome }}" = failure ]; then
            if [ -z "$open" ]; then
              gh label create health --color B60205 --description "wayhop.gr health check" 2>/dev/null || true
              gh issue create --title "wayhop.gr health check is failing" --label health --body-file report.md
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Healthy again. $(head -1 report.md)"
          fi
