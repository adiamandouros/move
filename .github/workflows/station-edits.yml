# Every night: the station edits made in the editor (/admin/stations), to
# positions.json and street.json, that the repository doesn't have yet, as
# one pull request from the branch station-edits. It's updated while there
# are edits waiting and closed once there are none; it's still yours to
# review and merge (decision 16). Run it by hand from the Actions tab
# ("Run workflow").
#
# Needs two repository secrets:
# - STATION_EXPORT_KEY: the same as the server's (.env), which reads the
#   editor's export and nothing else
# - STATION_EDITS_TOKEN: a fine-grained token for this repository only, with
#   Contents and Pull requests set to "Read and write". (A pull request
#   opened with the built-in token runs no checks.) Two weeks before it
#   expires, an issue labelled "token" says so, which GitHub emails to the
#   repository's watchers.
# (GitHub may run scheduled jobs late, and pauses them after 60 days without
# activity in the repository.)
name: Station edits

on:
  schedule:
    # 01:47 UTC: 03:47 or 04:47 in Athens, after the nightly run
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: station-edits

jobs:
  station-edits:
    runs-on: ubuntu-latest
    steps:
      - name: Say when the token is about to expire
        env:
          TOKEN: ${{ secrets.STATION_EDITS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub tells a token's expiry in this header (none: it never expires)
          expires=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$GH_REPO" \
            | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip')
          [ -n "$expires" ] || exit 0
          days=$(( ($(date -d "$expires" +%s) - $(date +%s)) / 86400 ))
          echo "The token expires on $expires, in $days days."
          open=$(gh issue list --label token --state open --json number --jq '.[0].number')
          if [ "$days" -le 14 ] && [ -z "$open" ]; then
            gh label create token --color FBCA04 --description "A workflow's token is about to expire" 2>/dev/null || true
            gh issue create --title "The station edits token expires on ${expires%% *}" --label token --body \
              "STATION_EDITS_TOKEN expires on $expires. Make a new fine-grained token for this repository (Contents and Pull requests: read and write) and put it in the repository's STATION_EDITS_TOKEN secret. The next run closes this issue."
          elif [ "$days" -gt 14 ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "Renewed: the token now expires on $expires."
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.STATION_EDITS_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch the editor's exports from wayhop.gr
        env:
          KEY: ${{ secrets.STATION_EXPORT_KEY }}
          EXPORTED: ${{ runner.temp }}/exported
        run: |
          mkdir -p "$EXPORTED"
          curl -fsS --max-time 60 -H "Authorization: Bearer $KEY" https://wayhop.gr/admin/api/export -o "$EXPORTED/positions.json"
          # street.json: not there (404) on a server from before it, which has no edits of it
          code=$(curl -sS --max-time 60 -H "Authorization: Bearer $KEY" -w '%{http_code}' https://wayhop.gr/admin/api/export/street.json -o "$EXPORTED/street.json")
          if [ "$code" = 404 ]; then cp data/curated/street.json "$EXPORTED/street.json"
          elif [ "$code" != 200 ]; then echo "street.json: HTTP $code"; exit 1; fi
          for file in positions street; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$EXPORTED/$file.json"; done
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ secrets.STATION_EDITS_TOKEN }}
          EXPORTED: ${{ runner.temp }}/exported
        run: |
          files="positions street"
          # Whether each exported file is the same as in the branch $1 (none: the repository's)
          same_as() {
            for file in $files; do
              if [ -z "$1" ]; then cat "data/curated/$file.json"; else git show "$1:data/curated/$file.json" 2>/dev/null; fi | cmp -s - "$EXPORTED/$file.json" || return 1
            done
          }
          open=$(gh pr list --head station-edits --state open --json number --jq '.[0].number')
          if same_as ""; then
            echo "No station edits waiting."
            [ -z "$open" ] || gh pr close "$open" --delete-branch --comment "Nothing left to commit: the repository has every edit."
            exit 0
          fi
          # Already in the pull request as it is: nothing to push, so its checks don't run again
          if [ -n "$open" ] && git fetch -q origin station-edits && same_as origin/station-edits; then
            echo "Pull request #$open already has these edits."
            exit 0
          fi
          node scripts/station-edits.js data/curated/positions.json "$EXPORTED/positions.json" data/curated/street.json "$EXPORTED/street.json" > "$RUNNER_TEMP/body.md"
          for file in $files; do cp "$EXPORTED/$file.json" "data/curated/$file.json"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B station-edits
          git commit -qm "Station edits from the editor" -- data/curated/positions.json data/curated/street.json
          git push -q --force origin station-edits
          if [ -n "$open" ]; then
            gh pr edit "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head station-edits --title "Station edits from the editor" --body-file "$RUNNER_TEMP/body.md"
          fi
