# Every night:
# - regression: the whole suite on main (npm run check: lint, type checks,
#   the Node tests and the browser tests), as on a pull request. It catches
#   what changes without a commit: the date (late-night trains, a timetable
#   running out), browsers, GitHub's runners.
# - live: a few checks against wayhop.gr itself (npm run test:live): its
#   pages, real timetable, announcements and live bus times. A handful of
#   requests to OASA, once a night.
# When either fails, an issue labelled "nightly" is opened, which GitHub
# emails to the repository's watchers, with a link to the run and its
# reports; the next good night closes it. Run it by hand from the Actions
# tab ("Run workflow").
# (GitHub may run scheduled jobs late, and pauses them after 60 days without
# activity in the repository.)
name: Nightly

on:
  schedule:
    # 00:17 UTC: 02:17 or 03:17 in Athens, when nobody is deploying
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      # Every browser test twice more, to catch flaky ones before a pull
      # request does (a test that passes only sometimes fails this)
      - name: Look for flaky browser tests
        run: npx playwright test --repeat-each=2 --retries=0
      - name: Keep the report, screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
      - name: Keep the report, screenshots and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report-live/
          retention-days: 14

  report:
    needs: [regression, live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Open or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGRESSION: ${{ needs.regression.result }}
          LIVE: ${{ needs.live.result }}
        run: |
          failed=""
          [ "$REGRESSION" = success ] || failed="the regression suite on main"
          [ "$LIVE" = success ] || failed="${failed:+$failed and }the checks of wayhop.gr"
          open=$(gh issue list --label nightly --state open --json number --jq '.[0].number')
          if [ -n "$failed" ]; then
            body="Failing: $failed. Run: $RUN (the reports, screenshots and traces are under Artifacts)."
            if [ -z "$open" ]; then
              gh label create nightly --color D93F0B --description "Nightly regression run" 2>/dev/null || true
              gh issue create --title "The nightly run is failing" --label nightly --body "$body"
            else
              gh issue comment "$open" --body "Still failing. $body"
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Passing again: $RUN"
          fi
